<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>定時報告作成</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; background:#f8fafc; color:#0f172a; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px; }
  h2 { font-size:15px; margin: 0 0 12px; }
  label { display:block; font-size:11px; color:#64748b; margin-bottom:3px; }
  input, textarea { border:1px solid #cbd5e1; border-radius:8px; padding:8px 9px; font-size:13px; font-family:inherit; width:100%; margin-bottom:8px; }
  button { background:#0d9488; color:#fff; border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  button.secondary { background:#fff; color:#334155; border:1px solid #cbd5e1; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:14px; margin-bottom:12px; }
  .row { display:flex; gap:8px; }
  .row > div { flex:1; }
  .timebtns { display:flex; gap:5px; margin-bottom:8px; }
  .timebtn { flex:1; text-align:center; padding:8px 2px; border-radius:7px; border:1px solid #e2e8f0; background:#fff; color:#64748b; cursor:pointer; font-size:12px; font-weight:600; }
  .timebtn.active { background:#0f172a; color:#fff; border-color:#0f172a; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:right; padding:5px 6px; border-bottom:1px solid #f1f5f9; }
  th:first-child, td:first-child { text-align:left; }
  th { color:#94a3b8; font-size:10px; }
  td input { width:60px; margin:0; padding:4px; text-align:right; }
  .muted { color:#94a3b8; font-size:11px; }
  .rate { display:flex; justify-content:space-between; background:#f0fdfa; border-radius:8px; padding:9px; margin:8px 0; font-weight:700; color:#0f766e; font-size:13px; }
  #out { white-space:pre-wrap; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:12px; font-size:13px; line-height:1.7; margin-top:8px; min-height:40px; }
  .wagerow { display:flex; align-items:center; gap:6px; }
  .wagerow input { margin:0; }
  .wagerow button { width:auto; padding:8px 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h2>📋 定時報告作成</h2>

  <div class="card">
    <div class="row">
      <div><label>店舗名</label><input id="storeName" value="出汁小林" /></div>
      <div><label>日付</label><input id="date" type="date" /></div>
    </div>
    <label>報告時刻</label>
    <div class="timebtns" id="timeBtns"></div>
    <button onclick="loadLabor()">この時刻までの人件費を計算</button>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>スタッフ</th><th>時間</th><th>調整(h)</th><th>金額</th></tr></thead>
      <tbody id="laborBody"></tbody>
    </table>
    <div class="row" style="margin-top:6px; justify-content:space-between; font-size:13px; font-weight:700;">
      <div>合計</div><div id="laborTotal">¥0</div>
    </div>
    <div class="wagerow" style="margin-top:8px;">
      <label style="margin:0; flex-shrink:0;">平均時給</label>
      <input id="avgWage" type="number" />
      <button onclick="saveAvgWage()">保存</button>
    </div>
  </div>

  <div class="card">
    <label>売上(税抜・円)</label>
    <input id="sales" type="number" oninput="updateRate()" />
    <div class="rate"><span>人件費率</span><span id="rate">--%</span></div>
    <div class="row">
      <div><label>10分以上オーバー(件)</label><input id="over" type="number" value="0" /></div>
      <div><label>サービス提供(件)</label><input id="service" type="number" value="0" /></div>
    </div>
    <label>欠品商品</label>
    <textarea id="missing" rows="2"></textarea>
  </div>

  <div class="card">
    <button onclick="makeText()">文章を作成</button>
    <div id="out"></div>
    <button class="secondary" style="margin-top:8px;" onclick="copyText()">コピー</button>
  </div>
</div>

<script>
const API_URL = "ここに定時報告用スクリプトのURLを貼り付け";
async function apiCall(action, payload) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, payload: payload || {} }),
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "unknown error");
  return json.data;
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

const TIMES = ["13:00", "15:00", "19:00", "21:00", "23:00"];
let selectedTime = "15:00";
let rows = [];

function init() {
  document.getElementById("date").value = todayStr();
  document.getElementById("timeBtns").innerHTML = TIMES.map((t) =>
    `<div class="timebtn ${t === selectedTime ? "active" : ""}" onclick="pickTime('${t}')">${Number(t.slice(0,2))}時</div>`
  ).join("");
  apiCall("getAverageWage").then((r) => { document.getElementById("avgWage").value = r.wage; }).catch(() => {});
}
init();

function pickTime(t) {
  selectedTime = t;
  document.querySelectorAll(".timebtn").forEach((el) => el.classList.toggle("active", el.textContent === Number(t.slice(0,2)) + "時"));
}

async function saveAvgWage() {
  const wage = Number(document.getElementById("avgWage").value) || 0;
  await apiCall("setAverageWage", { wage });
  alert("保存しました");
}

async function loadLabor() {
  const date = document.getElementById("date").value || todayStr();
  const body = document.getElementById("laborBody");
  body.innerHTML = `<tr><td colspan="4" class="muted" style="text-align:center;">計算中...</td></tr>`;
  let result;
  try {
    result = await apiCall("computeLaborCost", { date, cutoff: selectedTime });
  } catch (e) {
    body.innerHTML = `<tr><td colspan="4" class="muted" style="text-align:center;">失敗: ${e.message}</td></tr>`;
    return;
  }
  rows = result.rows.map((r) => Object.assign({ adjust: 0 }, r));
  render();
}

function render() {
  const body = document.getElementById("laborBody");
  body.innerHTML = "";
  rows.forEach((r, i) => {
    const h = Math.max(0, r.hours + r.adjust);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.name}</td>
      <td>${r.hours.toFixed(1)}h</td>
      <td><input type="number" step="0.1" value="${r.adjust}" onchange="adjust(${i}, this.value)"></td>
      <td>¥${Math.round(h * r.wage).toLocaleString("ja-JP")}</td>
    `;
    body.appendChild(tr);
  });
  if (rows.length === 0) body.innerHTML = `<tr><td colspan="4" class="muted" style="text-align:center;">シフトがありません</td></tr>`;
  updateTotal();
}

function adjust(i, val) {
  rows[i].adjust = Number(val) || 0;
  updateTotal();
}

function total() {
  return rows.reduce((s, r) => s + Math.max(0, r.hours + r.adjust) * r.wage, 0);
}

function updateTotal() {
  document.getElementById("laborTotal").textContent = "¥" + Math.round(total()).toLocaleString("ja-JP");
  updateRate();
}

function updateRate() {
  const sales = Number(document.getElementById("sales").value) || 0;
  const rateEl = document.getElementById("rate");
  rateEl.textContent = sales > 0 ? ((total() / sales) * 100).toFixed(1) + "%" : "--%";
}

function makeText() {
  const store = document.getElementById("storeName").value.trim();
  const sales = Number(document.getElementById("sales").value) || 0;
  const labor = Math.round(total());
  const rate = sales > 0 ? ((labor / sales) * 100).toFixed(1) : "0.0";
  const over = document.getElementById("over").value || "0";
  const service = document.getElementById("service").value || "0";
  const missing = document.getElementById("missing").value.trim();
  const h = Number(selectedTime.slice(0, 2));

  document.getElementById("out").textContent =
`${h}時定時報告致します。
${store}

売上（税抜）：${sales.toLocaleString("ja-JP")}
人件費：${labor.toLocaleString("ja-JP")}
人件費率：${rate}%

10分以上オーバー　${over}件
サービス提供　${service}件
（アイス、ドリンク等）
欠品商品
${missing}`;
}

async function copyText() {
  const text = document.getElementById("out").textContent;
  if (!text) { alert("先に「文章を作成」を押してください"); return; }
  try {
    await navigator.clipboard.writeText(text);
    alert("コピーしました");
  } catch (e) {
    alert("コピーに失敗しました。文章を長押ししてコピーしてください。");
  }
}
</script>
</body>
</html>
